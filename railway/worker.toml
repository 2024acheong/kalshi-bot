[build]
builder = "NIXPACKS"
buildCommand = "python -m pip install -U pip && python -m pip install -e packages/core -e services/worker -e services/models"
watchPatterns = [
  "services/worker/**",
  "services/models/**",
  "packages/core/**",
  "pyproject.toml",
]

[deploy]
startCommand = "python -m worker.main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
