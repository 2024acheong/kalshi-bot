[build]
builder = "NIXPACKS"
buildCommand = "python -m pip install -U pip && python -m pip install -e packages/core -e services/models -e services/worker"
watchPatterns = [
  "scripts/jobs/**",
  "services/models/**",
  "services/worker/**",
  "packages/core/**",
  "pyproject.toml",
]

[deploy]
startCommand = "python scripts/jobs/macro_daily.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1
