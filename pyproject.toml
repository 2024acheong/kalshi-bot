[tool.pytest.ini_options]
pythonpath = [
  ".",
  "packages/core",
  "apps/api",
  "services/worker",
  "services/research"
]
testpaths = [
  "packages/core/tests",
  "apps/api/tests",
  "services/worker/tests",
  "services/research/tests",
  "services/models/tests"
]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort
