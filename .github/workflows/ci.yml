name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python packages
        run: |
          python -m pip install -U pip
          python -m pip install pytest pytest-asyncio
          python -m pip install -e packages/core -e apps/api -e services/worker -e services/research -e services/models
      - name: Run tests
        run: python -m pytest

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install JS packages
        run: pnpm install --frozen-lockfile
      - name: Build web app
        env:
          CI: true
          SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SECRET_KEY: ci-build-placeholder
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
        run: pnpm --dir apps/web build
