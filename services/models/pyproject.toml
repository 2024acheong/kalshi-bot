[project]
name = "kalshi-models"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2",
    "fredapi>=0.5",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "supabase>=2.4",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["macro*", "shared*", "weather*"]
exclude = ["artifacts*"]
